paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  results_dir: results

acoustics:
  n_formants: 5
  max_formant_female: 5000
  max_formant_male: 4500
  long_vowel_ms: 80

neural:
  whisper_model: openai/whisper-medium
  whisper_layers: [6, 20]
